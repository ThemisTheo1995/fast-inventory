name: Staging-Pipeline

on:
  pull_request_review:
    types: [submitted]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  lint-and-test:
    name: Lint & Test
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_review' && 
       github.event.review.state == 'approved' && 
       github.event.pull_request.base.ref == 'master')
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:temp_password@localhost:5432/temp_db
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:temp_password@localhost:5432/temp_db

    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: temp_password
          POSTGRES_DB: temp_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        command: postgres -c log_min_messages=error

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync

      - name: Ruff Check
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run tests with Pytest
        run: |
          uv run pytest src/tests/ \
            --cov=src/erp \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            --junitxml=pytest.xml

  deploy-staging:
    name: Deploy to Staging Lambda via SAM
    needs: lint-and-test
    runs-on: ubuntu-latest

    env:
      ENVIRONMENT: ${{ vars.STAGING_ENVIRONMENT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Configure AWS Credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_STAGING_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Fetch Secrets from AWS Secrets Manager
        uses: aws-actions/aws-secretsmanager-get-secrets@v2
        with:
          secret-ids: |
            , aegis/${{ vars.STAGING_ENVIRONMENT }}/config
          parse-json-secrets: true

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v3
        with:
          use-installer: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: uv sync --no-dev

      - name: Run Alembic Migrations (Staging RDS)
        env :
          DATABASE_URL: ${{ secrets.STAGING_DB_URL }}
        run: |
          uv run alembic upgrade head

      - name: Export requirements for SAM build
        run: |
          uv export --no-dev -o src/requirements.txt --no-emit-project

      - name: Build SAM Application
        run: |
          sam build --use-container

      - name: Deploy SAM Application
        run: |
          sam deploy \
            --stack-name erp-core-api-${{ vars.STAGING_ENVIRONMENT }} \
            --s3-bucket ${{ vars.STAGING_S3_BUCKET }} \
            --s3-prefix erp-core-api-${{ vars.STAGING_ENVIRONMENT }} \
            --region eu-west-1 \
            --no-confirm-changeset \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
              Environment=${{ vars.STAGING_ENVIRONMENT }} \
              BarcodeQueueName=${{ vars.STAGING_BARCODE_QUEUE_NAME }}
