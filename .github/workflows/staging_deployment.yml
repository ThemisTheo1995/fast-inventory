name: Staging-Pipeline

on:
  pull_request_review:
    types: [submitted]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  lint-and-test:
    name: Lint & Test (RDS Staging)
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_review' && 
       github.event.review.state == 'approved' && 
       github.event.pull_request.base.ref == 'master')
    runs-on: ubuntu-latest

    env:
      ENVIRONMENT: ${{ vars.STAGING_ENVIRONMENT }}
      BASE_RDS_URL: ${{ secrets.STAGING_DB_URL }}
      TEST_DB_NAME: "test_db_${{ github.run_id }}_${{ github.run_attempt }}"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync

      - name: Ruff Check
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Create Temporary Test DB on RDS
        run: |
          uv run python -c "
          import psycopg, re
          # Strip SQLAlchemy driver prefixes like +asyncpg or +psycopg
          raw_url = '${{ env.BASE_RDS_URL }}'
          clean_url = re.sub(r'^postgresql\+[a-zA-Z0-9_]+://', 'postgresql://', raw_url)
          
          conn = psycopg.connect(clean_url, autocommit=True)
          with conn.cursor() as cur:
              cur.execute('CREATE DATABASE ${{ env.TEST_DB_NAME }};')
          conn.close()
          print('Successfully created database ${{ env.TEST_DB_NAME }} on RDS')
          "

      - name: Run Alembic migrations on RDS Test DB
        run: |
          TEST_URL=$(python -c "
          from urllib.parse import urlparse, urlunparse
          u = urlparse('${{ env.BASE_RDS_URL }}')
          print(urlunparse(u._replace(path='/${{ env.TEST_DB_NAME }}')))
          ")
          DATABASE_URL="$TEST_URL" uv run alembic upgrade head

      - name: Run tests with Pytest
        run: |
          TEST_URL=$(python -c "
          from urllib.parse import urlparse, urlunparse
          u = urlparse('${{ env.BASE_RDS_URL }}')
          print(urlunparse(u._replace(path='/${{ env.TEST_DB_NAME }}')))
          ")
          DATABASE_URL="$TEST_URL" TEST_DATABASE_URL="$TEST_URL" uv run pytest src/tests/ \
            --cov=src/erp \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            --junitxml=pytest.xml

      - name: Cleanup Temporary RDS Test DB
        if: always()
        run: |
          uv run python -c "
          import psycopg
          try:
              conn = psycopg.connect('${{ env.BASE_RDS_URL }}', autocommit=True)
              with conn.cursor() as cur:
                  cur.execute('DROP DATABASE IF EXISTS ${{ env.TEST_DB_NAME }} WITH (FORCE);')
              conn.close()
              print('Successfully dropped database ${{ env.TEST_DB_NAME }} from RDS')
          except Exception as e:
              print('Failed to drop test DB:', e)
          "

  deploy-staging:
    name: Deploy to Staging Lambda
    needs: lint-and-test
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.STAGING_DB_URL }}
      ENVIRONMENT: ${{ vars.STAGING_ENVIRONMENT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Configure AWS Credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_STAGING_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Install dependencies
        run: uv sync --no-dev

      - name: Run Alembic Migrations (Staging RDS)
        run: |
          uv run alembic upgrade head

      - name: Build Lambda Package
        run: |
          uv export --no-dev -o requirements.txt
          uv pip install -r requirements.txt --target ./build_pkg

          cp -r src ./build_pkg/src
          cp -r migrations ./build_pkg/migrations
          cp alembic.ini ./build_pkg/alembic.ini

          cd build_pkg
          zip -r9 ../deployment.zip .

      - name: Deploy to AWS Lambda
        run: |
          aws lambda update-function-code \
            --function-name aegis-staging \
            --zip-file fileb://deployment.zip
