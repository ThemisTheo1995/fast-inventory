name: Staging-Pipeline

on:
  pull_request_review:
    types: [submitted]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  lint-and-test:
    name: Lint & Test (Local DB Container)
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_review' && 
       github.event.review.state == 'approved' && 
       github.event.pull_request.base.ref == 'master')
    runs-on: ubuntu-latest

    env:
      ENVIRONMENT: ${{ vars.STAGING_ENVIRONMENT }}
      DATABASE_URL: postgresql+asyncpg://postgres:temp_password@localhost:5432/temp_db
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:temp_password@localhost:5432/temp_db
      AUTH_ALGORITHM: ${{ vars.AUTH_ALGORITHM }}
      AUTH_ACCESS_TOKEN_EXPIRE_MINUTES: ${{ vars.AUTH_ACCESS_TOKEN_EXPIRE_MINUTES }}
      AUTH_REFRESH_TOKEN_EXPIRE_DAYS: ${{ vars.AUTH_REFRESH_TOKEN_EXPIRE_DAYS }}
      COOKIE_SECURE: ${{ vars.COOKIE_SECURE }}
      AUTH_SECRET_KEY: ${{ secrets.AUTH_SECRET_KEY }}

    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: temp_password
          POSTGRES_DB: temp_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        command: postgres -c log_min_messages=error

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync

      - name: Ruff Check
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run Alembic migrations
        run: uv run alembic upgrade head

      - name: Run tests with Pytest
        run: |
          uv run pytest src/tests/ \
            --cov=src/erp \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            --junitxml=pytest.xml

  deploy-staging:
    name: Deploy to Staging Lambda
    needs: lint-and-test
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.STAGING_DB_URL }}
      ENVIRONMENT: ${{ vars.STAGING_ENVIRONMENT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Configure AWS Credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_STAGING_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Install dependencies
        run: uv sync --no-dev

      - name: Run Alembic Migrations (Staging RDS)
        run: |
          uv run alembic upgrade head

      - name: Build Lambda Package
        run: |
          rm -rf build_pkg
          mkdir build_pkg

          uv export --no-dev -o requirements.txt
          uv pip install \
            -r requirements.txt \
            --target ./build_pkg

          uv pip install \
            . \
            --target ./build_pkg \
            --no-deps

          cp -r migrations ./build_pkg/migrations
          cp alembic.ini ./build_pkg/alembic.ini

          cd build_pkg
          zip -r9 ../deployment.zip .


      - name: Deploy to AWS Lambda
        run: |
          aws lambda update-function-code \
            --function-name aegis-staging \
            --zip-file fileb://deployment.zip
