name: Staging-Deployment

on:
  pull_request_review:
    types: [submitted]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy-staging:
    name: Deploy to Staging Lambda
    if: github.event_name == 'workflow_dispatch' || github.event.review.state == 'approved'
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.STAGING_DB_URL }}
      ENVIRONMENT: ${{ vars.ENVIRONMENT }}
      AUTH_ALGORITHM: ${{ vars.AUTH_ALGORITHM }}
      AUTH_ACCESS_TOKEN_EXPIRE_MINUTES: ${{ vars.AUTH_ACCESS_TOKEN_EXPIRE_MINUTES }}
      AUTH_REFRESH_TOKEN_EXPIRE_DAYS: ${{ vars.AUTH_REFRESH_TOKEN_EXPIRE_DAYS }}
      COOKIE_SECURE: ${{ vars.COOKIE_SECURE }}
      AUTH_SECRET_KEY: ${{ secrets.AUTH_SECRET_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Configure AWS Credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_STAGING_ROLE_ARN }}
          aws-region: eu-west-1 

      - name: Install dependencies
        run: uv sync --no-dev

      - name: Run Alembic Migrations
        run: |
          uv run alembic upgrade head

      - name: Build Lambda Package
        run: |
          uv export --no-dev -o requirements.txt
          uv pip install -r requirements.txt --target ./build_pkg

          cp -r src ./build_pkg/src
          cp -r migrations ./build_pkg/migrations
          cp alembic.ini ./build_pkg/alembic.ini

          cd build_pkg
          zip -r9 ../deployment.zip .

      - name: Deploy to AWS Lambda
        run: |
          aws lambda update-function-code \
            --function-name aegis-staging \
            --zip-file fileb://deployment.zip
