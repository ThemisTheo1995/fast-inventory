name: Development-CI

on:
  pull_request:
    branches:
      - master

# Cancel in-progress runs if you push new commits to the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    env:
      ENVIRONMENT: ${{ vars.ENVIRONMENT }}
      DATABASE_URL: postgresql+asyncpg://postgres:temp_password@localhost:5432/temp_db
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:temp_password@localhost:5432/temp_db

    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: temp_password
          POSTGRES_DB: temp_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

        command: postgres -c log_min_messages=error

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync

      - name: Ruff Check
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run Alembic migrations
        run: uv run alembic upgrade head

      - name: Run tests with Pytest
        run: |
          uv run pytest src/tests/ \
            --cov=src/erp \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            --junitxml=pytest.xml
