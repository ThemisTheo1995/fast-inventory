AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Production-Grade ERP Core API & Serverless Microservice Stack. Optimized for high-throughput, low-latency FastAPI execution on ARM64 Graviton.

# ==============================================================================
# PARAMETERS
# ==============================================================================
Parameters:
  Environment:
    Type: String
    Default: staging
    AllowedValues:
    - staging
    - production
    Description: Target deployment environment.

  DatabaseUrlSecretArn:
    Type: String
    Description: AWS Secrets Manager ARN containing the PostgreSQL connection string.

  CorsAllowedOrigins:
    Type: String
    Default: "https://vue-inventory-six.vercel.app"
    Description: Comma-separated list of allowed CORS origins.

# ==============================================================================
# CONDITIONS & MAPPINGS
# ==============================================================================
Conditions:
  IsProduction: !Equals [ !Ref Environment, "production" ]

Mappings:
  EnvironmentConfig:
    staging:
      LambdaMemory: 256
      LambdaTimeout: 15
      LogLevel: "DEBUG"
      ApiBurstLimit: 10
      ApiRateLimit: 5
    production:
      LambdaMemory: 2048
      LambdaTimeout: 30
      LogLevel: "INFO"
      ApiBurstLimit: 500
      ApiRateLimit: 1000

# ==============================================================================
# GLOBALS
# ==============================================================================
Globals:
  Function:
    Timeout: !FindInMap [ EnvironmentConfig, !Ref Environment, LambdaTimeout ]
    MemorySize: !FindInMap [ EnvironmentConfig, !Ref Environment, LambdaMemory ]
    Architectures:
    - arm64
    Runtime: python3.13
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        LOG_LEVEL: !FindInMap [ EnvironmentConfig, !Ref Environment, LogLevel ]
        DATABASE_URL_SECRET_ARN: !Ref DatabaseUrlSecretArn
        POWERTOOLS_SERVICE_NAME: "erp-core-api"

# ==============================================================================
# RESOURCES
# ==============================================================================
Resources:

  # ----------------------------------------------------------------------------
  # 1. API GATEWAY (HTTP API v2)
  # ----------------------------------------------------------------------------
  ErpHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment
      CorsConfiguration:
        AllowOrigins:
        - !Ref CorsAllowedOrigins
        AllowHeaders:
        - Authorization
        - Content-Type
        - X-Amz-Date
        - X-Api-Key
        - X-Amz-Security-Token
        AllowMethods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingBurstLimit: !FindInMap [ EnvironmentConfig, !Ref Environment, ApiBurstLimit ]
        ThrottlingRateLimit: !FindInMap [ EnvironmentConfig, !Ref Environment, ApiRateLimit ]
      AccessLogSettings: !If
        - IsProduction
        - DestinationArn: !GetAtt ApiAccessLogGroup.Arn
          Format: >-
            {"requestId":"$context.requestId","ip":"$context.identity.sourceIp","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","routeKey":"$context.routeKey","status":"$context.status","protocol":"$context.protocol","responseLength":"$context.responseLength","latency":"$context.responseLatency"}
        - !Ref "AWS::NoValue"

  # Only create the API Access Log Group in production
  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: IsProduction
    Properties:
      LogGroupName: !Sub "/aws/http-api/erp-core-${Environment}"
      # Omit RetentionInDays to default to "Never Expire"

      # ----------------------------------------------------------------------------
      # 2. FASTAPI MONOLITH LAMBDA FUNCTION
      # ----------------------------------------------------------------------------
  ErpApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: erp.main.handler
      CodeUri: .
      Description: Core ERP FastAPI Web Handler managed by Mangum.
      ReservedConcurrentExecutions: !If [ IsProduction, !Ref "AWS::NoValue", 5 ]
      Policies:
      - AWSSecretsManagerGetSecretValuePolicy:
          SecretArn: !Ref DatabaseUrlSecretArn
      Events:
        ApiRouteAny:
          Type: HttpApi
          Properties:
            ApiId: !Ref ErpHttpApi
            Path: /{proxy+}
            Method: ANY
        ApiRouteRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref ErpHttpApi
            Path: /
            Method: ANY
      LoggingConfig:
        LogFormat: JSON
        ApplicationLogLevel: !FindInMap [ EnvironmentConfig, !Ref Environment, LogLevel ]
        LogGroup: !Ref ErpApiLogGroup

  ErpApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/erp-api-${Environment}"
      RetentionInDays: !If [ IsProduction, !Ref "AWS::NoValue", 90 ]

# ==============================================================================
# OUTPUTS
# ==============================================================================
Outputs:
  ApiEndpoint:
    Description: Base URL for HTTP API Endpoint
    Value: !Sub "https://${ErpHttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
    Export:
      Name: !Sub "ErpApiEndpoint-${Environment}"

  ApiFunctionArn:
    Description: ERP Core API Lambda Function ARN
    Value: !GetAtt ErpApiFunction.Arn
    Export:
      Name: !Sub "ErpApiFunctionArn-${Environment}"
